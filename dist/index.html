ASA ni implica su respaldo.`,"replay.completeTitle":`¡La constelación está completa!`,"replay.completeMessage":`¡Reuniste los seis fragmentos y terminaste las cinco misiones! Podemos abrir el archivo otra vez o quedarnos mirando las pistas que reunimos.`,"replay.startOver":`Volver a explorar`,"replay.stay":`Quedarme en la constelación`,"replay.stayFeedback":`Nos quedamos en la constelación. Puedes abrir cualquier fragmento que ya reuniste.`,"replay.confirmTitle":`¿Empezamos una nueva aventura?`,"replay.sparkPrompt":`Podemos volver a explorar el archivo. ¿Te animas?`,"replay.confirmMessage":`La próxima aventura empezará desde cero. Tus seis fragmentos y el avance de las misiones se borrarán del archivo. ¿Quieres continuar?`,"replay.confirmAction":`Sí, empezar de nuevo`,"replay.cancelAction":`Seguir en la constelación`,"replay.newAdventure":`¡Nueva aventura! El archivo vuelve a estar listo para explorar. Tus preferencias siguen guardadas.`,"welcome.spark":`¡Hola! Soy Spark. Este archivo guarda historias que casi se perdieron. ¿Descubrimos juntos quiénes fueron sus exploradores?`,"welcome.sparkAlt":`Spark, un pequeño robot morado con ruedas, ojos grandes y un proyector, saluda con la mano.`,"welcome.begin":`Comenzar a explorar`,"welcome.eyebrow":`Un libro de aventuras espaciales`,"welcome.sceneCaption":`Spark abre el atlas estelar del archivo.`,"welcome.sceneAlt":`Escena espacial ilustrada con Spark frente a un atlas de estrellas.`,"station.welcome":`¡Te damos la bienvenida a la Estación de la Memoria!`,"station.welcomeBack":`¡Qué bueno verte de nuevo en la Estación de la Memoria!`,"station.spark":`¡Los mapas empiezan a brillar! ¿Viajamos a Marte o a la Luna? En las dos expediciones hay pistas por descubrir.`,"station.sparkAlt":`Spark, el pequeño robot guardián, proyecta un mapa de Marte y la Luna en la Estación de la Memoria.`,"station.prompt":`¿Qué lugar quieres explorar?`,"station.mars":`Expedición a Marte`,"station.moon":`Expedición a la Luna`,"station.marsDetail":`Cuatro exploradores y sus pistas rojas`,"station.moonDetail":`Dos misiones sobre el suelo lunar`,"station.constellation":`Ver la constelación ({count}/{total})`,"nav.memoryStation":`Estación de la Memoria`,"nav.dossier":`Expediente de misión`,"nav.returnStation":`Volver a la Estación de la Memoria`,"nav.backTo":`Volver a {label}`,"nav.settings":`Configuración y accesibilidad`,"nav.skipMain":`Saltar al contenido principal`,"nav.constellationProgress":`Constelación de Recuerdos: {count} de {total} fragmentos reunidos`,"settings.title":`Configuración y accesibilidad`,"settings.close":`Cerrar configuración`,"settings.language":`Idioma de la aplicación`,"settings.reducedMotion":`Reducir movimiento`,"settings.highContrast":`Alto contraste`,"settings.sound":`Efectos de sonido`,"settings.narration":`Narración hablada`,"app.route.welcome":`Pantalla de bienvenida. El Archivo Espacial Perdido.`,"app.route.station":`Estación de la Memoria. Elige una expedición.`,"app.route.mars":`Mapa de la expedición a Marte.`,"app.route.moon":`Mapa de la expedición lunar.`,"app.route.dossier":`Expediente de misión. Historia y datos.`,"app.route.challenge":`Reto de exploración.`,"app.route.fragment":`Fragmento de memoria encontrado.`,"app.route.constellation":`Constelación de Recuerdos.`,"map.mars.title":`Expedición a Marte`,"map.moon.title":`Expedición a la Luna`,"map.mars.label":`Mapa de Marte con {count} misiones`,"map.moon.label":`Mapa lunar con {count} misiones`,"map.instruction":`Elige una misión para explorar.`,"map.mission":`{name}: {subtitle}. Selecciona para ver los detalles de la misión.`,"map.comingSoon":`Próximamente`,"map.legend":`Estado de las misiones`,"map.state.available":`Disponible`,"map.state.visited":`Visitada`,"map.state.completed":`Completada`,"map.missionState":`{name}: {subtitle}. Estado: {state}. Selecciona para ver los detalles de la misión.`,"map.sojourner":`Primeras ruedas en Marte`,"map.spirit":`Detective del agua`,"map.opportunity":`Pistas de agua`,"map.ingenuity":`Primer vuelo en otro planeta`,"map.surveyor":`Exploración del suelo lunar`,"map.apollo17":`Ruta de exploración lunar`,"map.schematic":`Ilustración esquemática; las posiciones de los marcadores no son coordenadas geográficas.`,"map.preview.siteLabel":`Zona de la misión`,"map.selectionDetails":`Detalles de la misión seleccionada`,"map.preview.emptyTitle":`Elige una misión en el mapa`,"map.preview.emptyBody":`Toca un marcador para conocer el lugar, el vehículo y la actividad de aprendizaje.`,"map.preview.characterAlt":`Ilustración de {name}`,"map.preview.announcement":`{name}, {location}. Estado: {state}.`,"map.preview.open":`Abrir expediente de misión`,"map.preview.clear":`Quitar selección`,"map.preview.learningObjective":`En este reto aprenderás:`,"map.site.aresVallis":`Región de Ares Vallis`,"map.site.gusevCrater":`Cráter Gusev`,"map.site.meridianiPlanum":`Planicie Meridiani`,"map.site.jezeroCrater":`Cráter Jezero`,"map.site.oceanusProcellarum":`Zona sudeste de Oceanus Procellarum`,"map.site.taurusLittrow":`Valle Taurus–Littrow`,"map.preview.sojourner":`Conoce el pequeño rover que llegó con Mars Pathfinder y explora sus herramientas científicas.`,"map.preview.spirit":`Sigue la pista de sílice hallada durante la exploración de Marte por Spirit.`,"map.preview.opportunity":`Explora las pequeñas esferas ricas en hematita que encontró Opportunity.`,"map.preview.ingenuity":`Prueba una actividad de tres etapas sobre el vuelo controlado en Marte.`,"map.preview.surveyor":`Prueba una actividad simplificada sobre cómo tomar y examinar suelo lunar.`,"map.preview.apollo17":`Planifica una ruta simplificada para un rover lunar en una simulación educativa.`,"map.objective.sojourner":`Relaciona las piezas del rover con la tarea que cumple cada una.`,"map.objective.spirit":`Interpreta la sílice como una pista posible de agua caliente antigua.`,"map.objective.opportunity":`Usa las esferas de hematita como pistas de agua antigua.`,"map.objective.ingenuity":`Sigue tres etapas de un vuelo propulsado y controlado.`,"map.objective.surveyor":`Compara pruebas de excavación, soporte e impacto del suelo.`,"map.objective.apollo17":`Distingue la distancia total de un recorrido y la distancia al módulo lunar.`,"dossier.unavailableTitle":`Expediente no disponible`,"dossier.unavailableBody":`Este expediente todavía no está disponible.`,"dossier.inProgress":`Estamos preparando el expediente científico y el reto de {object}. Puedes volver a la expedición y elegir otra misión.`,"dossier.invalidObject":`Ese explorador no pertenece a este expediente. Regresa al mapa y elige una de las misiones disponibles.`,"moon.unavailable":`Esta expedición todavía no está disponible. Vuelve a la Estación de la Memoria para explorar la misión de Sojourner.`,"dossier.sparkAlt":`Spark, el pequeño robot guardián, mira el expediente con curiosidad.`,"dossier.sojournerAlt":`Sojourner, un rover dorado pequeño de seis ruedas, con panel solar, cámaras y un brazo para estudiar rocas.`,"dossier.startChallenge":`Comenzar el reto`,"dossier.startMission":`Explorar esta misión`,"dossier.objective":`Objetivo de la misión`,"dossier.context":`Historia de la misión`,"dossier.capabilities":`Instrumentos y capacidades`,"dossier.findings":`Descubrimientos`,"dossier.timeline":`Cronología`,"dossier.legacy":`Legado`,"dossier.sources":`Fuentes`,"dossier.record.spirit":`Spirit (Mars Exploration Rover A)`,"dossier.record.opportunity":`Opportunity (Mars Exploration Rover B)`,"dossier.record.sojourner":`Sojourner (rover Mars Pathfinder)`,"dossier.record.ingenuity":`Ingenuity (helicóptero de Marte)`,"dossier.record.surveyor3":`Surveyor 3 (sonda lunar)`,"dossier.record.apollo17":`Vehículo lunar Apollo 17 (LRV-3)`,"character.meetTitle":`Conoce a las y los exploradores`,"character.chooseSpeaker":`Elige quién quiere contarte algo`,"character.nextThought":`Escuchar otra idea`,"character.hearLine":`Escuchar a {name}`,"character.fictionNote":`Su personalidad y su manera de hablar son inventadas para el cuento. Los datos que mencionan vienen de las tarjetas con fuentes de NASA.`,"character.reaction.introduction":`Presentación`,"character.reaction.discovery":`Descubrimiento`,"character.reaction.surprise":`Sorpresa`,"character.reaction.encouragement":`Ánimo`,"character.reaction.celebration":`Celebración`,"character.spirit.name":`Spirit`,"character.spirit.personality":`Curioso, valiente y persistente.`,"character.spirit.voice":`Habla con calma y curiosidad; siempre invita a mirar otra vez.`,"character.spirit.alt":`Ilustración de Spirit, un rover de seis ruedas con panel solar, mástil de cámaras y brazo científico.`,"character.spirit.intro":`Soy Spirit. Me gusta explorar con valentía y observar con cuidado.`,"character.spirit.discovery":`¡Encontré una pista nueva! ¿Qué notas tú?`,"character.spirit.surprise":`¡Oh! No esperaba ver un patrón así.`,"character.spirit.encouragement":`Sigamos paso a paso; mirar con atención ayuda mucho.`,"character.spirit.celebration":`¡Lo logramos! Guardemos esta pista en el archivo.`,"character.opportunity.name":`Opportunity`,"character.opportunity.personality":`Optimista, observadora, ingeniosa y entusiasta.`,"character.opportunity.voice":`Habla con energía y le gusta comparar pistas y detalles.`,"character.opportunity.alt":`Ilustración de Opportunity, el rover gemelo de Spirit con seis ruedas, panel solar, mástil de cámaras y brazo científico.`,"character.opportunity.intro":`Soy Opportunity. Me encanta comparar pistas y buscar detalles.`,"character.opportunity.discovery":`Esta pista parece distinta. ¿La comparamos?`,"character.opportunity.surprise":`¡Vaya! Ese detalle sí que me sorprende.`,"character.opportunity.encouragement":`Cada pista cuenta. ¡Probemos otra forma de mirarla!`,"character.opportunity.celebration":`¡Qué buen hallazgo! Juntas, nuestras pistas cuentan más.`,"character.sojourner.name":`Sojourner`,"character.sojourner.personality":`Pequeño, independiente y muy observador.`,"character.sojourner.voice":`Usa frases breves y anima a avanzar con cuidado.`,"character.sojourner.alt":`Ilustración de Sojourner, un rover compacto de seis ruedas con panel solar y brazo para estudiar rocas.`,"character.sojourner.intro":`Soy Sojourner, un pequeño explorador que avanza con curiosidad.`,"character.sojourner.discovery":`¡Hay algo nuevo cerca! Miremos con atención.`,"character.sojourner.surprise":`¡Esa forma es diferente! Voy a observarla mejor.`,"character.sojourner.encouragement":`Un paso cuidadoso también nos lleva lejos.`,"character.sojourner.celebration":`¡Avanzamos juntos hasta la siguiente pista!`,"character.ingenuity.name":`Ingenuity`,"character.ingenuity.personality":`Audaz, imaginativo y juguetón.`,"character.ingenuity.voice":`Usa imágenes juguetonas y propone una perspectiva nueva.`,"character.ingenuity.alt":`Ilustración del helicóptero Ingenuity con dos rotores coaxiales, panel solar y cuatro patas.`,"character.ingenuity.intro":`Soy Ingenuity. Me gusta imaginar nuevas formas de mirar.`,"character.ingenuity.discovery":`Imaginemos cómo se vería este camino desde arriba.`,"character.ingenuity.surprise":`¡Qué sorpresa! Desde otra perspectiva, todo parece distinto.`,"character.ingenuity.encouragement":`Probemos una idea nueva y veamos qué descubrimos.`,"character.ingenuity.celebration":`¡Una idea genial nos abrió otro punto de vista!`,"character.surveyor3.name":`Surveyor 3`,"character.surveyor3.personality":`Paciente, meticuloso y científico.`,"character.surveyor3.voice":`Hace preguntas tranquilas y observa con precisión.`,"character.surveyor3.alt":`Ilustración de Surveyor 3, una sonda lunar de tres patas con cámara y muestreador de suelo.`,"character.surveyor3.intro":`Soy Surveyor 3. Prefiero observar con paciencia antes de sacar conclusiones.`,"character.surveyor3.discovery":`¿Qué notas en esta parte del suelo? Miremos con cuidado.`,"character.surveyor3.surprise":`¡No esperaba encontrar una forma así!`,"character.surveyor3.encouragement":`Una buena pregunta empieza con una observación atenta.`,"character.surveyor3.celebration":`¡Nuestra observación nos dio una pista para recordar!`,"character.apollo17.name":`Vehículo lunar del Apollo 17`,"character.apollo17.personality":`Aventurero, sociable y explorador.`,"character.apollo17.voice":`Habla con entusiasmo y propone planear rutas en equipo.`,"character.apollo17.alt":`Ilustración del vehículo lunar Apollo 17 con chasis abierto, cuatro ruedas de malla, dos asientos y antena parabólica.`,"character.apollo17.intro":`Soy el vehículo lunar del Apollo 17. ¡Me gusta explorar en equipo!`,"character.apollo17.discovery":`¡Apareció otra pista! ¿Por qué camino seguimos?`,"character.apollo17.surprise":`¡Ese paisaje me asombra! Pensemos por dónde avanzar.`,"character.apollo17.encouragement":`Si planeamos juntos, podemos elegir un buen recorrido.`,"character.apollo17.celebration":`¡Ruta planeada y pista guardada! ¡Buen trabajo, equipo!`,"character.chapter.who":`¿Quién soy?`,"character.chapter.mission":`Mi misión`,"character.chapter.moment":`Mi gran momento`,"character.chapter.journey":`Mi viaje`,"character.chapter.legacy":`Lo que recordamos`,"character.chapterProgress":`Capítulo {current} de {total}`,"character.nextChapter":`Siguiente capítulo`,"character.previousChapter":`Capítulo anterior`,"character.restartStory":`Escuchar desde el inicio`,"character.spirit.story1":`¡Hola! Soy Spirit, un rover de seis ruedas. Tengo una gemela, Opportunity, pero cada una exploró un lugar distinto de Marte.`,"character.spirit.story2":`Despegué el 10 de junio de 2003 y aterricé en el cráter Gusev el 3 de enero de 2004. Mi trabajo: buscar en las rocas y el suelo pistas de agua antigua.`,"character.spirit.story3":`Un día encontré una zona rica en sílice. ¡Esa pista podría señalar que hace muchísimo tiempo hubo agua caliente!`,"character.spirit.story4":`Mi misión principal estaba planeada para 90 días… ¡y trabajé en Marte más de seis años! Mirar con paciencia me llevó muy lejos.`,"character.spirit.story5":`Mis pistas siguen guardadas en el archivo. Cada vez que miras una roca con atención, exploras un poquito como yo.`,"character.opportunity.story1":`¡Hola! Soy Opportunity, la gemela de Spirit. Yo aterricé en otro lugar de Marte: una llanura llamada Meridiani Planum.`,"character.opportunity.story2":`Mi misión era buscar pruebas de agua antigua y de lugares que quizá pudieron sostener vida. Llevaba cámaras, un microscopio, imanes y una herramienta para desgastar rocas.`,"character.opportunity.story3":`¡Encontré pequeñas esferas ricas en hematita! Las apodaron «arándanos». Junto con las rocas, mostraron que el agua líquida afectó esa región.`,"character.opportunity.story4":`Me comuniqué por última vez el 10 de junio de 2018. NASA declaró el fin de mi misión el 13 de febrero de 2019.`,"character.opportunity.story5":`Operé en Marte casi 15 años y recorrí 45,16 kilómetros. ¡Paso a paso se puede llegar lejísimos!`,"character.sojourner.story1":`Soy Sojourner, un rover pequeñito de seis ruedas. Viajé a Marte con la sonda Mars Pathfinder.`,"character.sojourner.story2":`Pathfinder llegó a Marte el 4 de julio de 1997 y yo bajé a la superficie el 6 de julio. Mis primeros objetivos estaban a unos 10 metros de la sonda.`,"character.sojourner.story3":`Las señales tardaban unos 10 minutos en viajar entre la Tierra y Marte. ¡Por eso tenía que saber actuar por mí mismo mientras esperaba!`,"character.sojourner.story4":`Mi plan era trabajar 7 días… ¡y funcioné 83 días! Con mis cámaras y mi espectrómetro estudié las rocas cercanas.`,"character.sojourner.story5":`Mi viaje ayudó a probar cómo llevar y manejar un rover pequeño en Marte. Un paso pequeño también puede abrir un camino grande.`,"character.ingenuity.story1":`¡Bzzz! Soy Ingenuity, un helicóptero pequeño. Llegué a Marte junto al rover Perseverance en febrero de 2021.`,"character.ingenuity.story2":`Me crearon para responder una gran pregunta: ¿se puede volar en el aire tan tenue de Marte? No soy un rover: soy una prueba de tecnología.`,"character.ingenuity.story3":`El 19 de abril de 2021 hice el primer vuelo propulsado y controlado en otro planeta. ¡Desde arriba todo se veía distinto!`,"character.ingenuity.story4":`Completé 72 vuelos. El último fue el 18 de enero de 2024, y NASA anunció el fin de mi misión el 25 de enero.`,"character.ingenuity.story5":`Después de probar que podía volar, ayudé al equipo de Perseverance a explorar rutas desde el aire. ¡Una idea atrevida abrió un camino nuevo!`,"character.surveyor3.story1":`Hola. Soy Surveyor 3, una sonda lunar de tres patas. No tengo ruedas: observo con paciencia desde un solo lugar de la Luna.`,"character.surveyor3.story2":`Aterricé suavemente el 20 de abril de 1967. Mi trabajo era estudiar la superficie y el suelo lunar con mi cámara de televisión y mi muestreador.`,"character.surveyor3.story3":`Con mi muestreador cavé cuatro zanjas, hice cuatro pruebas de soporte y trece pruebas de impacto. ¡Así aprendimos cómo era el suelo!`,"character.surveyor3.story4":`Me comuniqué por última vez el 4 de mayo de 1967. Después me quedé en silencio sobre la Luna.`,"character.surveyor3.story5":`En 1969, los astronautas del Apollo 12 me visitaron y llevaron mi pala y mi cámara a la Tierra para estudiarlas. ¡Qué visita tan especial!`,"character.apollo17.story1":`¡Hola, equipo! Soy el vehículo lunar del Apollo 17. Soy eléctrico, funciono con baterías y me conducían los astronautas.`,"character.apollo17.story2":`Mi trabajo era llevar personas y equipo para que los astronautas pudieran explorar una zona más amplia de la Luna.`,"character.apollo17.story3":`Hicimos tres recorridos. El más largo fue de 20,1 kilómetros, ¡y llegamos a estar a 7,6 kilómetros del módulo lunar!`,"character.apollo17.story4":`Sumando los tres recorridos, rodé 35,9 kilómetros por la Luna.`,"character.apollo17.story5":`Con mis ruedas, los astronautas llegaron más lejos que a pie. ¡Explorar en equipo nos llevó más lejos!`,"dossier.spiritOpportunityIntro":`Spirit y Opportunity eran rovers gemelos: dos exploradores distintos que compartían una misión. Cada uno recorrió un lugar diferente de Marte.`,"dossier.sojuIntro":`Sojourner fue un pequeño rover de seis ruedas que ayudó a demostrar cómo explorar la superficie de Marte.`,"dossier.ingenuityIntro":`Ingenuity fue un helicóptero de prueba que logró el primer vuelo propulsado y controlado en otro planeta.`,"dossier.surveyorIntro":`Surveyor 3 aterrizó suavemente en la Luna y probó cómo se comportaba el suelo lunar.`,"dossier.apollo17Intro":`El vehículo lunar de Apollo 17 llevó a sus astronautas más lejos para explorar el valle Taurus-Littrow.`,"science.sojourner-pathfinder-timeline":`La sonda Mars Pathfinder llegó a Marte el 4 de julio de 1997. Sojourner bajó a la superficie el 6 de julio.`,"science.sojourner-control":`Sojourner tenía seis ruedas. Una persona en la Tierra lo conducía usando imágenes del rover y de la sonda de aterrizaje.`,"science.sojourner-signal-delay":`Las señales de radio tardaban unos 10 minutos en viajar entre la Tierra y Marte. Por eso, Sojourner necesitaba poder actuar por sí mismo mientras esperaba.`,"science.sojourner-planned-exploration":`Los primeros objetivos de Sojourner estaban planeados para sus primeros 7 días marcianos, a unos 10 metros de la sonda de aterrizaje.`,"facts.source":`Fuente:`,"facts.explainTerms":`¿Qué significan estas palabras?`,"facts.simulationNotice":`Simulación simplificada para aprender. Los datos de la misión provienen de fuentes de NASA.`,"facts.viewSources":`Ver fuentes`,"challenge.notAvailableTitle":`Reto no disponible`,"challenge.notAvailableBody":`Este reto todavía no está disponible.`,"challenge.sojournerTitle":`Construye a Sojourner: primeras ruedas en Marte`,"challenge.sojournerInstruction":`Sojourner fue un rover de Marte. Arrastra cada pieza para construirlo. Selecciona una pieza para escuchar qué hace.`,"challenge.chassis":`Chasis del rover`,"challenge.parts":`Piezas`,"challenge.dragParts":`Arrastra las piezas al chasis`,"challenge.partAction":`Arrastra al chasis o presiona Enter para enge.term.rover":`Un vehículo robot que explora la superficie de un mundo.`,"challenge.chassisLabel":`Chasis del rover Sojourner con cinco espacios para piezas`,"challenge.partPlacedAnnounce":`Pieza colocada en el rover`,"fragment.notFoundTitle":`Fragmento no encontrado`,"fragment.notFoundBody":`Este fragmento todavía no está disponible.`,"fragment.backStation":`Volver a la Estación de la Memoria`,"fragment.found":`¡Fragmento de memoria encontrado!`,"fragment.foundMultiple":`¡Fragmentos de memoria encontrados!`,"fragment.sojournerTitle":`La primera huella de Sojourner`,"fragment.sojournerCaption":`Las primeras ruedas en Marte. 83 días marcianos. 16 rocas analizadas. Los rovers pequeños pueden explorar planetas enormes.`,"fragment.added":`Añadido a la Constelación ({count}/{total})`,"fragment.announcement":`Fragmento de memoria encontrado: {title}. {caption}`,"fragment.multipleAnnouncement":`Encontraste los recuerdos de Spirit y Opportunity. Ambos fragmentos se añadieron a la constelación.`,"fragment.viewConstellation":`Ver la constelación`,"constellation.title":`Constelación de Recuerdos`,"constellation.progressLabel":`{count} de {total} recuerdos recuperados`,"constellation.instruction":`Selecciona una estrella iluminada para volver a ver un recuerdo.`,"constellation.continue":`Continuar explorando`,"constellation.detailTitle":`Fragmento de memoria`,"constellation.notExplored":`Aún no has explorado esta misión. Completa su reto para descubrir el recuerdo.`,"constellation.close":`Cerrar`,"error.generic":`Algo salió mal. Inténtalo de nuevo.`,"error.notFound":`No encontramos esta página.`,"error.notFoundTitle":`Página no encontrada`,"error.backStation":`Volver a la Estación de la Memoria`,"spark.welcome":`¡Hola! Soy Spark. Este archivo guarda historias que casi se perdieron. ¿Descubrimos juntos quiénes fueron sus exploradores?`,"spark.hear":`Escuchar a Spark`,"spark.station":`¡Los mapas empiezan a brillar! ¿Viajamos a Marte o a la Luna? En las dos expediciones hay pistas por descubrir.`,"spark.spiritOpportunity":`¡Mira estas pistas! Spirit encontró sílice y Opportunity pequeñas esferas de hematita. ¿Qué nos cuentan sobre el agua antigua?`,"spark.sojourner":`Sojourner tenía seis ruedas y su misión duró mucho más de lo planeado. ¡Veamos cómo se movía por Marte!`,"spark.ingenuity":`¿Un helicóptero en Marte? Ingenuity probó que podía volar y luego ayudó a explorar rutas desde el aire.`,"spark.surveyor":`Surveyor 3 usó una pala para probar el suelo lunar. ¿Qué crees que revelaron sus zanjas?`,"spark.apollo17":`El rover del Apollo 17 recorrió 35,9 km en total y su punto más lejano estuvo a 7,6 km del módulo lunar. ¿Planeamos una ruta sencilla?`,"spark.alt":`Spark, el pequeño robot guardián del archivo, con ruedas, ojos brillantes y un proyector.`,"art.aiDisclosure":`Ilustración generada con inteligencia artificial`,"challenge.spirit.instruction":`Compara las pistas de Spirit y Opportunity para descubrir qué nos cuentan sobre el agua antigua en Marte.`,"challenge.ingenuity.instruction":`Planea una ruta de vuelo sencilla para Ingenuity. Este juego simplifica el vuelo real, que era controlado por computadora.`,"challenge.surveyor.instruction":`Usa el brazo de muestreo para cavar y probar el suelo lunar.`,"challenge.apollo17.instruction":`Planifica una ruta simplificada y compara la distancia total con el punto más lejano al módulo lunar.`,"challenge.correct":`¡Muy bien! Esa respuesta coincide con los datos de la misión.`,"challenge.tryAgain":`¡Buen intento! Revisa las pistas y vuelve a probar.`,"science.spirit-site":`Spirit exploró el cráter Gusev y buscó pistas de agua antigua en las rocas y el suelo.`,"science.spirit-silica":`Spirit encontró una zona rica en sílice, una pista que podría señalar actividad antigua de agua caliente.`,"science.opportunity-site":`Opportunity exploró Meridiani Planum y encontró pequeñas esferas ricas en hematita, apodadas arándanos.`,"science.opportunity-water":`Las rocas y esferas estudiadas por Opportunity aportaron pruebas de que el agua líquida afectó esta región.`,"science.opportunity-distance":`NASA informa que Opportunity recorrió 45,16 kilómetros durante su misión.`,"science.ingenuity-first-flight":`El 19 de abril de 2021, Ingenuity realizó el primer vuelo propulsado y controlado en otro planeta.`,"science.ingenuity-flights":`Ingenuity completó 72 vuelos. Su vuelo final fue el 18 de enero de 2024; NASA anunció el fin de la misión el 25 de enero.`,"science.surveyor-sampler":`Surveyor 3 usó un muestreador de superficie para cavar cuatro zanjas, hacer cuatro pruebas de soporte y trece pruebas de impacto.`,"science.surveyor-apollo12":`Los astronautas del Apollo 12 visitaron Surveyor 3 en 1969 y trajeron su pala de suelo y cámara de televisión para estudiarlas.`,"science.apollo17-traverses":`El rover lunar del Apollo 17 se usó en tres recorridos y cubrió 35,9 kilómetros en total.`,"science.apollo17-longest-traverse":`El recorrido individual más largo del Apollo 17 fue de 20,1 kilómetros. Su distancia máxima del módulo lunar fue de 7,6 kilómetros.`,"dossier.date":`Fecha`,"dossier.objectRecord":`Registro del objeto`,"dossier.title.mer":`Los exploradores gemelos de Marte`,"dossier.title.sojourner":`La pequeña Pathfinder`,"dossier.title.ingenuity":`El primer vuelo`,"dossier.title.surveyor":`La visitante lunar`,"dossier.title.apollo17":`Vehículo lunar del Apollo 17`,"dossier.section.objective":`Objetivo de la misión`,"dossier.section.history":`Contexto histórico`,"dossier.section.capabilities":`Instrumentos y capacidades`,"dossier.section.findings":`Descubrimientos y logros`,"dossier.section.timeline":`Cronología de la misión`,"dossier.section.legacy":`Legado`,"science.sojourner-objective":`Mars Pathfinder probó una forma de llevar y operar un rover móvil pequeño en Marte.`,"science.sojourner-tools":`Sojourner llevaba un espectrómetro APXS y cámaras para estudiar rocas y la superficie cercana.`,"science.sojourner-legacy":`Sojourner funcionó durante 83 días, mucho más que los siete días planeados para el rover.`,"science.spirit-objective":`Spirit fue enviado a explorar rocas y suelo para buscar pistas de si el agua había cambiado Marte.`,"science.spirit-timeline":`Spirit despegó el 10 de junio de 2003 y aterrizó en el cráter Gusev el 3 de enero de 2004.`,"science.spirit-tools":`Spirit usó cámaras, espectrómetros, un microscopio, imanes y una herramienta para desgastar rocas.`,"science.spirit-legacy":`Spirit trabajó en Marte durante más de seis años, mucho más que su misión principal planeada de 90 días.`,"science.opportunity-objective":`Opportunity buscó pruebas de agua antigua y de ambientes que quizá pudieron sostener vida.`,"science.opportunity-tools":`Opportunity usó cámaras, espectrómetros, un microscopio, imanes y una herramienta para desgastar rocas.`,"science.opportunity-timeline":`Opportunity se comunicó por última vez el 10 de junio de 2018. NASA declaró el fin de la misión el 13 de febrero de 2019.`,"science.opportunity-legacy":`Opportunity operó en Marte casi 15 años y recorrió 45,16 kilómetros, según el perfil de misión de NASA.`,"science.ingenuity-objective":`Ingenuity se creó para probar si un vuelo propulsado y controlado podía funcionar en la tenue atmósfera de Marte.`,"science.ingenuity-capabilities":`Ingenuity llevaba una cámara a color del terreno y una cámara de navegación en blanco y negro; era una demostración tecnológica, no un rover.`,"science.ingenuity-timeline":`Ingenuity llegó con Perseverance en febrero de 2021, voló por primera vez el 19 de abril de 2021 y realizó su último vuelo el 18 de enero de 2024.`,"science.ingenuity-legacy":`Tras probar que podía volar, Ingenuity también ayudó al equipo de Perseverance a explorar rutas desde el aire.`,"science.surveyor-objective":`Surveyor 3 probó un aterrizaje suave e investigó la superficie y el suelo de la Luna.`,"science.surveyor-tools":`Surveyor 3 usó una cámara de televisión y un muestreador de superficie para examinar el suelo lunar.`,"science.surveyor-timeline":`Surveyor 3 aterrizó el 20 de abril de 1967 y se comunicó por última vez el 4 de mayo de 1967. Los astronautas del Apollo 12 lo visitaron en 1969.`,"science.surveyor-legacy":`El Apollo 12 trajo la pala de suelo y la cámara de televisión de Surveyor 3 para que se estudiaran en la Tierra.`,"science.apollo17-objective":`El vehículo lunar del Apollo 17 ayudó a los astronautas a explorar una zona más amplia de la Luna.`,"science.apollo17-capabilities":`El LRV era un vehículo eléctrico con baterías, conducido por astronautas para transportar personas y equipo por la Luna.`,"science.apollo17-timeline":`Los astronautas del Apollo 17 usaron el rover lunar en tres recorridos por la superficie.`,"science.apollo17-legacy":`El rover del Apollo 17 recorrió 35,9 kilómetros en total. Su recorrido individual más largo fue de 20,1 kilómetros y su distancia máxima al módulo lunar fue de 7,6 kilómetros.`,"challenge.playTitle":`Actividad de exploración`,"challenge.twinTitle":`Detectives de pistas de agua`,"challenge.flightTitle":`Plan de vuelo de Ingenuity`,"challenge.samplingTitle":`Muestreo del suelo lunar`,"challenge.routeTitle":`Ruta lunar del Apollo 17`,"challenge.chooseEvidence":`Elige el explorador que encontró esta pista:`,"challenge.evidenceSilica":`Una zona rica en sílice que podría señalar actividad de agua caliente.`,"challenge.evidenceHematite":`Pequeñas esferas ricas en hematita, apodadas arándanos.`,"challenge.spirit":`Spirit`,"challenge.opportunity":`Opportunity`,"challenge.clueSolved":`¡Pista resuelta!`,"challenge.tryAgainShort":`Prueba otra vez`,"challenge.flightStep":`Guía el vuelo por tres puntos de observación. Esta ruta es una simulación educativa.`,"challenge.nextCheckpoint":`Avanzar al siguiente punto`,"challenge.sampleStep":`Prueba las acciones del muestreador: excavar, apoyar y golpear el suelo.`,"challenge.dig":`Cavar una zanja`,"challenge.bearing":`Probar el soporte del suelo`,"challenge.impact":`Probar el impacto`,"challenge.samplesDone":`Pruebas completadas: {count}/3`,"challenge.checkpointsDone":`Puntos de vuelo recorridos: {count}/3`,"challenge.routeStep":`Primero revisa las tres medidas del registro del Apollo 17. Después compara los planes simplificados.`,"challenge.routeRecordTotal":`Distancia total recorrida por el Apollo 17`,"challenge.routeTotal":`Distancia total del plan`,"challenge.routeLongestTraverse":`Recorrido individual más largo`,"challenge.routeMaxRange":`Distancia máxima al módulo lunar`,"challenge.routeFarthest":`Punto más lejano del plan`,"challenge.routeOptions":`Planes de ruta simplificados`,"challenge.routePlanA":`Plan uno · recorrido amplio`,"challenge.routePlanB":`Plan dos · punto lejano`,"challenge.routePlanC":`Plan tres · circuito corto`,"challenge.routeWithinRecordedRange":`El punto más lejano queda dentro de la distancia máxima registrada.`,"challenge.routeBeyondRecordedRange":`El punto más lejano supera la distancia máxima del registro del Apollo 17.`,"challenge.routeMapModule":`Módulo lunar`,"challenge.routeMapVehicle":`Vehículo`,"challenge.routeMapFarthest":`Punto más lejano`,"challenge.routeSchematicNote":`Esquema educativo, no es un mapa histórico a escala. Los planes son inventados para practicar la lectura de distancias.`,"challenge.routeChoice":`Ruta de {distance} km`,"challenge.routeProgress":`Distancia planeada: {distance} km de 7,6 km`,"challenge.routeChoiceDetailed":`{total} km en total; punto más lejano a {farthest} km del módulo lunar`,"challenge.routeProgressSelected":`Plan elegido: {total} km en total; punto más lejano a {farthest} km del módulo lunar.`,"challenge.routeNotSelected":`Elige uno de los planes de ruta simplificados.`,"challenge.routeFits":`Este plan simplificado coincide con el ejemplo histórico de distancia. Una ruta puede sumar más de 7,6 km y mantenerse a menos de 7,6 km del módulo lunar.`,"challenge.routeIncomplete":`Elige un plan cuyo punto más lejano no supere los 7,6 km del registro, para que coincida con la distancia máxima documentada del Apollo 17.`,"challenge.twinIncomplete":`Relaciona las dos pistas para continuar: la sílice corresponde a Spirit y las esferas ricas en hematita, a Opportunity.`,"challenge.flightIncomplete":`Visita los tres puntos de observación antes de terminar el plan de vuelo.`,"challenge.samplingIncomplete":`Prueba las tres acciones del muestreador antes de terminar la actividad.`,"challenge.flightPoint":`Punto de observación {count}`,"challenge.flightProgress":`¡Punto alcanzado! En esta simulación simplificada, el helicóptero sigue una secuencia de puntos de observación planeados.`,"challenge.sampleProgress":`Prueba del muestreador registrada. Prueba otra acción para aprender cómo Surveyor 3 examinó el suelo lunar.`,"challenge.digResult":`La pala movió y recogió suelo suelto, y dejó una zanja pequeña en esta simulación.`,"challenge.bearingResult":`La prueba de soporte presionó el suelo para observar qué tan firme estaba.`,"challenge.impactResult":`El muestreador golpeó el suelo para que los científicos observaran cómo respondía.`,"challenge.routeDiagramAlt":`Ruta lunar simplificada: {total} kilómetros recorridos en total, con el punto más lejano a {farthest} kilómetros del módulo lunar.`,"challenge.routeDiagramCaption":`La línea de color muestra el recorrido planeado. La línea punteada conecta el módulo con el punto más lejano del plan.`,"challenge.finishActivity":`Comprobar y completar actividad`,"challenge.activityComplete":`¡Actividad completada! Has encontrado un fragmento de memoria.`,"challenge.routeExceeded":`Este plan simplificado llega más lejos que la distancia máxima registrada para el Apollo 17. Prueba otro plan para comparar las medidas.`,"challenge.surveyorSceneAlt":`Escena educativa de Surveyor 3 sobre la superficie lunar. El brazo de muestreo cambia con las acciones y {count} de tres pruebas aparecen completadas.`,"challenge.surveyorSceneCaption":`Escena simplificada: el brazo y las marcas del suelo muestran las acciones elegidas.`,"challenge.surveyorSampleField":`Zona de muestreo`,"challenge.wrongAnswer":`Esa pista pertenece al otro rover. ¡Prueba de nuevo!`,"challenge.activitySourceNote":`Actividad simplificada para aprender; no recrea operaciones reales.`,"fragment.spiritTitle":`La pista de sílice de Spirit`,"fragment.spiritCaption":`Una pista mineral que podría señalar agua caliente antigua en Marte.`,"fragment.opportunityTitle":`Los arándanos de Opportunity`,"fragment.opportunityCaption":`Pequeñas esferas ricas en hematita ayudaron a revelar un Marte antiguo con agua.`,"fragment.ingenuityTitle":`Las alas de Ingenuity`,"fragment.ingenuityCaption":`El primer vuelo propulsado y controlado en otro planeta abrió un nuevo camino de exploración.`,"fragment.surveyorTitle":`La pala de Surveyor 3`,"fragment.surveyorCaption":`Sus pruebas ayudaron a estudiar cómo se comporta el suelo lunar.`,"fragment.apollo17Title":`La ruta del Apollo 17`,"fragment.apollo17Caption":`Un vehículo eléctrico amplió el alcance de exploración de los astronautas en la Luna.`},en:{"welcome.overviewTitle":`Which stories will we discover?`,"welcome.overviewIntro":`On Mars and the Moon, NASA mission equipment left traces of exploration. Join Spark to discover their stories and what they helped us learn.`,"welcome.overviewMars":`Meet Sojourner, twins Spirit and Opportunity, and the helicopter Ingenuity. Build a rover, follow clues in rocks, and explore flight.`,"welcome.overviewMoon":`Discover Surveyor 3 and the Apollo 17 lunar rover. Investigate the soil and choose an exploration route.`,"welcome.overviewJourney":`Choose a mission, discover its story, try an activity, and collect memories for your constellation.`,"language.label":`Language`,"language.spanish":`Spanish`,"language.english":`English`,"app.title":`The Lost Space Archive`,"footer.teamLogoAlt":`Grupo Épico team logo`,"footer.event":`NASA Space Apps Challenge — Barranquilla 2026`,"footer.sourcesLabel":`Official science sources`,"footer.sourcesTitle":`Sources for further exploring`,"footer.nssdca":`NSS tion!`,"station.welcomeBack":`Welcome back to the Memory Station!`,"station.spark":`The maps are beginning to glow! Shall we travel to Mars or the Moon? Both expeditions are full of clues.`,"station.sparkAlt":`Spark, the small Archive Keeper robot, projects a map of Mars and the Moon in the Memory Station.`,"station.prompt":`Where would you like to explore?`,"station.mars":`Mars Expedition`,"station.moon":`Moon Expedition`,"station.marsDetail":`Four explorers and their red-planet clues`,"station.moonDetail":`Two missions on the lunar surface`,"station.constellation":`View Constellation ({count}/{total})`,"nav.memoryStation":`Memory Station`,"nav.dossier":`Mission Dossier`,"nav.returnStation":`Return to Memory Station`,"nav.backTo":`Back to {label}`,"nav.settings":`Settings and Accessibility`,"nav.skipMain":`Skip to main content`,"nav.constellationProgress":`Constellation of Memories: {count} of {total} fragments collected`,"settings.title":`Settings and Accessibility`,"settings.close":`Close settings`,"settings.language":`Application language`,"settings.reducedMotion":`Reduce motion`,"settings.highContrast":`High contrast`,"settings.sound":`Sound effects`,"settings.narration":`Spoken narration`,"app.route.welcome":`Welcome screen. The Lost Space Archive.`,"app.route.station":`Memory Station. Choose an expedition.`,"app.route.mars":`Mars Expedition Map.`,"app.route.moon":`Moon Expedition Map.`,"app.route.dossier":`Mission dossier. Story and facts.`,"app.route.challenge":`Exploration challenge.`,"app.route.fragment":`Memory fragment found.`,"app.route.constellation":`Constellation of Memories.`,"map.mars.title":`Mars Expedition`,"map.moon.title":`Moon Expedition`,"map.mars.label":`Mars map with {count} missions`,"map.moon.label":`Moon map with {count} missions`,"map.instruction":`Choose a mission to explore.`,"map.mission":`{name}: {subtitle}. Select to preview mission details.`,"map.comingSoon":`Coming Soon`,"map.legend":`Mission status`,"map.state.available":`Available`,"map.state.visited":`Visited`,"map.state.completed":`Completed`,"map.missionState":`{name}: {subtitle}. Status: {state}. Select to preview mission details.`,"map.sojourner":`First Wheels on Mars`,"map.spirit":`Water Detective`,"map.opportunity":`Water Clues`,"map.ingenuity":`First Flight on Another Planet`,"map.surveyor":`Lunar Soil Exploration`,"map.apollo17":`Lunar Exploration Route`,"map.schematic":`Illustrative landscape; marker positions are schematic, not geographic coordinates.`,"map.preview.siteLabel":`Mission area`,"map.selectionDetails":`Selected mission details`,"map.preview.emptyTitle":`Choose a mission on the map`,"map.preview.emptyBody":`Select a marker to learn about its location, vehicle, and learning activity.`,"map.preview.characterAlt":`Illustration of {name}`,"map.preview.announcement":`{name}, {location}. Status: {state}.`,"map.preview.open":`Open mission dossier`,"map.preview.clear":`Clear selection`,"map.preview.learningObjective":`In this challenge, you will learn to:`,"map.site.aresVallis":`Ares Vallis region`,"map.site.gusevCrater":`Gusev Crater`,"map.site.meridianiPlanum":`Meridiani Planum`,"map.site.jezeroCrater":`Jezero Crater`,"map.site.oceanusProcellarum":`Southeastern Oceanus Procellarum`,"map.site.taurusLittrow":`Taurus–Littrow Valley`,"map.preview.sojourner":`Meet the small rover delivered with Mars Pathfinder and explore its scientific tools.`,"map.preview.spirit":`Follow the silica clue found during Spirit’s exploration of Mars.`,"map.preview.opportunity":`Explore the hematite-rich spherules found by Opportunity.`,"map.preview.ingenuity":`Try a three-checkpoint learning activity about powered flight on Mars.`,"map.preview.surveyor":`Try a simplified activity about sampling and examining lunar soil.`,"map.preview.apollo17":`Plan a simplified lunar rover route in a learning simulation.`,"map.objective.sojourner":`Match rover parts to the job each one performs.`,"map.objective.spirit":`Interpret silica as a possible clue of ancient hot-water activity.`,"map.objective.opportunity":`Use hematite-rich spheres as clues about ancient water.`,"map.objective.ingenuity":`Follow three stages of powered, controlled flight.`,"map.objective.surveyor":`Compare tests of lunar soil digging, support, and impact.`,"map.objective.apollo17":`Distinguish total route travel from distance to the lunar module.`,"dossier.unavailableTitle":`Dossier Unavailable`,"dossier.unavailableBody":`This dossier is not available yet.`,"dossier.inProgress":`We are preparing the science dossier and challenge for {object}. You can return to the expedition and choose another mission.`,"dossier.invalidObject":`That explorer does not belong in this dossier. Return to the map and choose an available mission.`,"moon.unavailable":`This expedition is not available yet. Return to the Memory Station to explore the open Sojourner mission.`,"dossier.sparkAlt":`Spark, the small Archive Keeper robot, looks curiously at the mission dossier.`,"dossier.sojournerAlt":`Sojourner, a small golden six-wheeled rover with a solar panel, cameras, and a rock study arm.`,"dossier.startChallenge":`Start Challenge`,"dossier.startMission":`Explore this mission`,"dossier.objective":`Mission Objective`,"dossier.context":`Mission History`,"dossier.capabilities":`Instruments and Capabilities`,"dossier.findings":`Discoveries`,"dossier.timeline":`Timeline`,"dossier.legacy":`Legacy`,"dossier.sources":`Sources`,"dossier.record.spirit":`Spirit (Mars Exploration Rover A)`,"dossier.record.opportunity":`Opportunity (Mars Exploration Rover B)`,"dossier.record.sojourner":`Sojourner (Mars Pathfinder rover)`,"dossier.record.ingenuity":`Ingenuity (Mars Helicopter)`,"dossier.record.surveyor3":`Surveyor 3 (lunar lander)`,"dossier.record.apollo17":`Apollo 17 Lunar Roving Vehicle (LRV-3)`,"character.meetTitle":`Meet the explorers`,"character.chooseSpeaker":`Choose which twin will speak`,"character.nextThought":`Hear another thought`,"character.hearLine":`Hear {name}`,"character.fictionNote":`Their personalities and way of talking are made up for the story. The facts they mention come from the NASA-sourced cards.`,"character.reaction.introduction":`Introduction`,"character.reaction.discovery":`Discovery`,"character.reaction.surprise":`Surprise`,"character.reaction.encouragement":`Encouragement`,"character.reaction.celebration":`Celebration`,"character.spirit.name":`Spirit`,"character.spirit.personality":`Curious, brave, and persistent.`,"character.spirit.voice":`Speaks calmly and curiously, always inviting another close look.`,"character.spirit.alt":`Illustration of Spirit, a six-wheeled rover with a solar deck, camera mast, and science arm.`,"character.spirit.intro":`I’m Spirit. I like exploring bravely and looking carefully.`,"character.spirit.discovery":`I found a new clue! What do you notice?`,"character.spirit.surprise":`Oh! I did not expect to see a pattern like that.`,"character.spirit.encouragement":`Let’s go step by step; a careful look can help a lot.`,"character.spirit.celebration":`We did it! Let’s save this clue in the archive.`,"character.opportunity.name":`Opportunity`,"character.opportunity.personality":`Optimistic, observant, resourceful, and enthusiastic.`,"character.opportunity.voice":`Speaks with energy and loves comparing clues and details.`,"character.opportunity.alt":`Illustration of Opportunity, Spirit’s twin rover with six wheels, a solar deck, camera mast, and science arm.`,"character.opportunity.intro":`I’m Opportunity. I love comparing clues and looking for details.`,"character.opportunity.discovery":`This clue looks different. Shall we compare it?`,"character.opportunity.surprise":`Wow! That detail really surprises me.`,"character.opportunity.encouragement":`Every clue counts. Let’s try looking at it another way!`,"character.opportunity.celebration":`What a find! Together, our clues can tell us more.`,"character.sojourner.name":`Sojourner`,"character.sojourner.personality":`A small pioneer who is curious, independent, and observant.`,"character.sojourner.voice":`Uses short lines and encourages careful steps.`,"character.sojourner.alt":`Illustration of Sojourner, a compact six-wheeled rover with a solar deck and rock study arm.`,"character.sojourner.intro":`I’m Sojourner, a small explorer who moves ahead with curiosity.`,"character.sojourner.discovery":`There’s something new nearby! Let’s take a careful look.`,"character.sojourner.surprise":`That shape is different! I’ll take a closer look.`,"character.sojourner.encouragement":`One careful step can still take us far.`,"character.sojourner.celebration":`We made it to the next clue together!`,"character.ingenuity.name":`Ingenuity`,"character.ingenuity.personality":`Bold, imaginative, and playful.`,"character.ingenuity.voice":`Uses playful images and offers a fresh point of view.`,"character.ingenuity.alt":`Illustration of the Ingenuity helicopter with two coaxial rotors, a solar panel, and four legs.`,"character.ingenuity.intro":`I’m Ingenuity. I like imagining new ways to look around.`,"character.ingenuity.discovery":`Let’s imagine how this path might look from above.`,"character.ingenuity.surprise":`What a surprise! Everything looks different from another view.`,"character.ingenuity.encouragement":`Let’s try a new idea and see what we discover.`,"character.ingenuity.celebration":`A great idea opened up another point of view!`,"character.surveyor3.name":`Surveyor 3`,"character.surveyor3.personality":`Patient, meticulous, and scientific.`,"character.surveyor3.voice":`Asks calm questions and observes carefully.`,"character.surveyor3.alt":`Illustration of Surveyor 3, a three-legged lunar lander with a camera and soil sampler.`,"character.surveyor3.intro":`I’m Surveyor 3. I like to observe patiently before drawing a conclusion.`,"character.surveyor3.discovery":`What do you notice in this patch of ground? Let’s look closely.`,"character.surveyor3.surprise":`I did not expect to find a shape like that!`,"character.surveyor3.encouragement":`A good question starts with a careful observation.`,"character.surveyor3.celebration":`Our observations gave us a clue to remember!`,"character.apollo17.name":`Apollo 17 Lunar Roving Vehicle`,"character.apollo17.personality":`Adventurous, sociable, and exploratory.`,"character.apollo17.voice":`Speaks with enthusiasm and suggests planning routes together.`,"character.apollo17.alt":`Illustration of the Apollo 17 lunar rover with an open frame, four mesh wheels, two seats, and dish antenna.`,"character.apollo17.intro":`I’m the Apollo 17 lunar rover. I love exploring as a team!`,"character.apollo17.discovery":`A new clue appeared! Which way should we go?`,"character.apollo17.surprise":`That landscape amazes me! Let’s think about our route.`,"character.apollo17.encouragement":`If we plan together, we can choose a good path.`,"character.apollo17.celebration":`Route planned and clue saved! Great work, team!`,"character.chapter.who":`Who am I?`,"character.chapter.mission":`My mission`,"character.chapter.moment":`My big moment`,"character.chapter.journey":`My journey`,"character.chapter.legacy":`What we remember`,"character.chapterProgress":`Chapter {current} of {total}`,"character.nextChapter":`Next chapter`,"character.previousChapter":`Previous chapter`,"character.restartStory":`Hear it from the start`,"character.spirit.story1":`Hi! I’m Spirit, a six-wheeled rover. I have a twin, Opportunity, but we each explored a different place on Mars.`,"character.spirit.story2":`I launched on June 10, 2003, and landed in Gusev Crater on January 3, 2004. My job: search rocks and soil for clues about ancient water.`,"character.spirit.story3":`One day I found a patch rich in silica. That clue could mean there was hot water there a very long time ago!`,"character.spirit.story4":`My main mission was planned for 90 days… and I worked on Mars for more than six years! Looking patiently took me a long way.`,"character.spirit.story5":`My clues are still kept in the archive. Every time you look closely at a rock, you explore a little bit like me.`,"character.opportunity.story1":`Hi! I’m Opportunity, Spirit’s twin. I landed somewhere else on Mars: a plain called Meridiani Planum.`,"character.opportunity.story2":`My mission was to look for evidence of ancient water and of places that might once have supported life. I carried cameras, a microscope, magnets and a rock-grinding tool.`,"character.opportunity.story3":`I found tiny spheres rich in hematite! People nicknamed them “blueberries”. Together with the rocks, they showed that liquid water affected the area.`,"character.opportunity.story4":`I last communicated on June 10, 2018. NASA declared my mission complete on February 13, 2019.`,"character.opportunity.story5":`I worked on Mars for almost 15 years and drove 45.16 kilometers. Step by step, you can go really far!`,"character.sojourner.story1":`I’m Sojourner, a tiny six-wheeled rover. I traveled to Mars with the Mars Pathfinder lander.`,"character.sojourner.story2":`Pathfinder reached Mars on July 4, 1997, and I rolled onto the surface on July 6. My first targets were about 10 meters from the lander.`,"character.sojourner.story3":`Radio signals took about 10 minutes to travel between Earth and Mars. So I had to know how to act on my own while I waited!`,"character.sojourner.story4":`I was planned to work for 7 days… and I kept going for 83 days! I used my cameras and spectrometer to study nearby rocks.`,"character.sojourner.story5":`My trip helped show how to deliver and drive a small rover on Mars. A small step can open a big path.`,"character.ingenuity.story1":`Bzzz! I’m Ingenuity, a small helicopter. I arrived on Mars with the Perseverance rover in February 2021.`,"character.ingenuity.story2":`I was built to answer a big question: can anything fly in the very thin air of Mars? I’m not a rover — I’m a technology test.`,"character.ingenuity.story3":`On April 19, 2021, I made the first powered, controlled flight on another planet. Everything looked different from up there!`,"character.ingenuity.story4":`I completed 72 flights. My last flight was on January 18, 2024, and NASA announced the end of my mission on January 25.`,"character.ingenuity.story5":`After proving I could fly, I helped the Perseverance team scout routes from the air. A bold idea opened a new path!`,"character.surveyor3.story1":`Hello. I’m Surveyor 3, a three-legged lunar lander. I have no wheels: I observe patiently from one spot on the Moon.`,"character.surveyor3.story2":`I made a soft landing on April 20, 1967. My job was to study the Moon’s surface and soil with my TV camera and my surface sampler.`,"character.surveyor3.story3":`With my sampler I dug four trenches and did four bearing tests and thirteen impact tests. That’s how we learned what the soil was like!`,"character.surveyor3.story4":`I last communicated on May 4, 1967. After that, I stayed quiet on the Moon.`,"character.surveyor3.story5":`In 1969, the Apollo 12 astronauts visited me and took my soil scoop and camera back to Earth to study them. What a special visit!`,"character.apollo17.story1":`Hello, team! I’m the Apollo 17 lunar rover. I’m electric, I run on batteries, and astronauts drove me.`,"character.apollo17.story2":`My job was to carry people and equipment so the astronauts could explore a wider area of the Moon.`,"character.apollo17.story3":`We made three drives. The longest was 20.1 kilometers, and we got as far as 7.6 kilometers from the lunar module!`,"character.apollo17.story4":`Adding up all three drives, I rolled 35.9 kilometers across the Moon.`,"character.apollo17.story5":`With my wheels, the astronauts went farther than on foot. Exploring as a team took us further!`,"dossier.spiritOpportunityIntro":`Spirit and Opportunity were twin rovers: two separate explorers on one mission. Each traveled to a different place on Mars.`,"dossier.sojuIntro":`Sojourner was a small, six-wheeled rover that helped show how to explore the surface of Mars.`,"dossier.ingenuityIntro":`Ingenuity was a test helicopter that made the first powered, controlled flight on another planet.`,"dossier.surveyorIntro":`Surveyor 3 made a soft landing on the Moon and tested how lunar soil behaved.`,"dossier.apollo17Intro":`The Apollo 17 lunar vehicle carried its astronauts farther as they explored the Taurus-Littrow Valley.`,"science.sojourner-pathfinder-timeline":`The Mars Pathfinder lander reached Mars on July 4, 1997. Sojourner rolled onto the surface on July 6.`,"science.sojourner-control":`Sojourner had six wheels. An operator on Earth drove it using images from the rover and lander.`,"science.sojourner-signal-delay":`Radio signals took about 10 minutes to travel between Earth and Mars, so Sojourner needed some ability to act on its own while waiting.`,"science.sojourner-planned-exploration":`Sojourner's first planned goals covered its first 7 Martian days, within about 10 meters of the lander.`,"facts.source":`Source:`,"facts.explainTerms":`What do these words mean?`,"facts.simulationNotice":`Simulation — simplified for learning. Mission data comes from NASA sources.`,"facts.viewSources":`View sources`,"challenge.notAvailableTitle":`Challenge Unavailable`,"challenge.notAvailableBody":`This challenge is not available yet.`,"challenge.sojournerTitle":`Build Sojourner: First Wheels on Mars`,"challenge.sojournerInstruction":`Sojourner was a Mars rover. Drag each part to build it. Select a part to hear what it does.`,"challenge.chassis":`Rover Chassis`,"challenge.parts":`Parts`,"challenge.dragParts":`Drag parts to the chassis`,"challenge.partAction":`Drag to the chassis or press Enter to select.`,"challenge.placedOnRover":`Placed on rover.`,"challenge.slotEmpty":`Empty slot for {part}`,"challenge.slotFilled":`{part}, placed on rover`,"challenge.leaveTitle":`Leave Challenge?`,"challenge.leaveBody":`Your progress is saved. You can continue later.`,"challenge.goStation":`Go to Memory Station`,"challenge.stay":`Stay and Continue`,"challenge.collectFragment":`
